name: Website veröffentlichen

on:
  push:
    branches:
      - main          # Wird automatisch ausgeführt, wenn Sie auf "main" pushen
  workflow_dispatch:  # Manuelle Ausführung über die GitHub-Oberfläche möglich

# Berechtigung für GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: pnpm installieren
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # -------------------------------------------------------
      # BASE_PATH anpassen:
      #   - Normales Repository (z.B. "trift-website"):
      #       BASE_PATH=/${GITHUB_REPOSITORY#*/}/
      #   - Wenn das Repository "benutzername.github.io" heißt:
      #       BASE_PATH=/
      # -------------------------------------------------------
      - name: Website bauen
        env:
          PORT: "3000"
          BASE_PATH: "/${{ github.event.repository.name }}/"
          NODE_ENV: production
        run: pnpm --filter @workspace/trift-elektrotechnik run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./artifacts/trift-elektrotechnik/dist/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
